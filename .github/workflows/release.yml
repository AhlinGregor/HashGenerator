name: Build Installers

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        run: |
          mvn clean package -DskipTests

      - name: Create macOS DMG
        run: |
          jpackage \
            --type dmg \
            --input target \
            --main-jar HashGenerator-1.0-SNAPSHOT.jar \
            --dest dist \
            --name HashGenerator \
            --app-version ${GITHUB_REF#refs/tags/v} \
            --runtime-image $JAVA_HOME

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        shell: powershell
        run: |
          mvn clean package -DskipTests

      - name: Create Windows EXE Installer
        shell: powershell
        run: |
          jpackage `
            --type exe `
            --input target `
            --main-jar HashGenerator-1.0-SNAPSHOT.jar `
            --dest dist `
            --name HashGenerator `
            --runtime-image $JAVA_HOME `
            --app-version ${env:GITHUB_REF -replace 'refs/tags/v',''}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  build-linux:
    name: Build Linux (.deb + AppImage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y libfuse2 wget
          wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        run: |
          mvn clean package -DskipTests

      - name: Create DEB Installer
        run: |
          jpackage \
            --type deb \
            --input target \
            --main-jar HashGenerator-1.0-SNAPSHOT.jar \
            --dest dist \
            --name HashGenerator \
            --app-version ${GITHUB_REF#refs/tags/v} \
            --runtime-image $JAVA_HOME

      - name: Build AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp target/HashGenerator-1.0-SNAPSHOT.jar AppDir/usr/bin/
          echo '[Desktop Entry]
          Type=Application
          Name=HashGenerator
          Exec=java -jar usr/bin/HashGenerator-1.0-SNAPSHOT.jar
          Icon=application-default-icon
          Categories=Utility;' > AppDir/HashGenerator.desktop
          chmod +x AppDir/HashGenerator.desktop

      - name: Build AppImage
        run: |
          ./appimagetool AppDir dist/HashGenerator-${GITHUB_REF#refs/tags/}.AppImage

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/*.deb
            dist/*.AppImage

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/* 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
